kind = "web"
previewPath = "/"
title = "CivicAI"
description = "A civic issue reporting platform where residents submit photo-based infrastructure complaints, track progress on a public map, and authorities triage and resolve reports."
version = "1.0.0"
id = "artifacts/civicai"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 18555

[services.development]
run = "pnpm --filter @workspace/civicai run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/civicai", "run", "build" ]
serve = "static"
publicDir = "artifacts/civicai/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "18555"
BASE_PATH = "/"
