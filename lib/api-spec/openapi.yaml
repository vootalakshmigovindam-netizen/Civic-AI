openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: CivicAI civic issue reporting API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: Complaints
    description: Civic issue reports and status tracking
  - name: Dashboard
    description: CivicAI statistics
  - name: AI
    description: Optional image analysis with demo fallback
  - name: Uploads
    description: Complaint photo upload and secure delivery
  - name: Storage
    description: Object storage upload and serving endpoints
  - name: Auth
    description: Browser authentication endpoints
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /complaints:
    get:
      operationId: listComplaints
      tags: [Complaints]
      summary: List public complaints with filters
      parameters:
        - name: issueType
          in: query
          schema: { type: string }
        - name: severity
          in: query
          schema: { type: string }
        - name: status
          in: query
          schema: { type: string }
        - name: search
          in: query
          schema: { type: string }
      responses:
        "200":
          description: Complaint results
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Complaint" }
    post:
      operationId: createComplaint
      tags: [Complaints]
      summary: Submit a civic complaint
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ComplaintInput" }
      responses:
        "201":
          description: Complaint created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Complaint" }
        "401":
          description: Sign-in required
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }
  /complaints/my:
    get:
      operationId: listMyComplaints
      tags: [Complaints]
      summary: List complaints submitted by the signed-in citizen
      responses:
        "200":
          description: Citizen complaint list
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Complaint" }
  /complaints/{id}:
    get:
      operationId: getComplaint
      tags: [Complaints]
      summary: Get complaint details
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Complaint
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Complaint" }
        "404":
          description: Complaint not found
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }
  /complaints/{id}/history:
    get:
      operationId: getComplaintHistory
      tags: [Complaints]
      summary: Get complaint status history
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Status history
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/StatusHistory" }
  /complaints/{id}/status:
    patch:
      operationId: updateComplaintStatus
      tags: [Complaints]
      summary: Change a complaint status as an authority
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ComplaintStatusUpdate" }
      responses:
        "200":
          description: Updated complaint
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Complaint" }
        "403":
          description: Authority access required
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }
  /map/complaints:
    get:
      operationId: listMapComplaints
      tags: [Complaints]
      summary: Get complaint markers for the map
      parameters:
        - name: issueType
          in: query
          schema: { type: string }
        - name: severity
          in: query
          schema: { type: string }
        - name: status
          in: query
          schema: { type: string }
      responses:
        "200":
          description: Public map complaint markers
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Complaint" }
  /dashboard/summary:
    get:
      operationId: getDashboardSummary
      tags: [Dashboard]
      summary: Get public impact and complaint summary
      responses:
        "200":
          description: Summary counts
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DashboardSummary" }
  /ai/analyze:
    post:
      operationId: analyzeImage
      tags: [AI]
      summary: Analyze an uploaded image or return labeled demo analysis
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ImageAnalysisInput" }
      responses:
        "200":
          description: Analysis result
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ImageAnalysis" }
  /storage/uploads/request-url:
    post:
      operationId: requestUploadUrl
      tags: [Storage]
      summary: Request a secure direct upload URL for a complaint image
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UploadUrlRequest" }
      responses:
        "200":
          description: Presigned upload URL generated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UploadUrlResponse" }
  /storage/objects/acl:
    post:
      operationId: finalizeComplaintImageUpload
      tags: [Storage]
      summary: Mark an uploaded complaint image as private and owned by the citizen
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/FinalizeObjectUploadInput" }
      responses:
        "200":
          description: Image secured for the uploading citizen
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FinalizeObjectUploadResult" }
  /storage/objects/{objectPath}:
    get:
      operationId: getStorageObject
      tags: [Storage]
      summary: Serve a private uploaded photo to its owner or an authority
      parameters:
        - name: objectPath
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Object content
          content:
            "*/*":
              schema: { type: string, format: binary }
  /storage/public-objects/{filePath}:
    get:
      operationId: getPublicObject
      tags: [Storage]
      summary: Serve a public application asset
      parameters:
        - name: filePath
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Object content
          content:
            "*/*":
              schema: { type: string, format: binary }
  /auth/user:
    get:
      operationId: getCurrentAuthUser
      tags: [Auth]
      summary: Get the currently authenticated user
      responses:
        "200":
          description: Current auth state
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthUserEnvelope" }
  /login:
    get:
      operationId: beginBrowserLogin
      tags: [Auth]
      summary: Start browser login
      parameters:
        - name: returnTo
          in: query
          schema: { type: string }
      responses:
        "302": { description: Redirect to identity provider }
  /callback:
    get:
      operationId: handleBrowserLoginCallback
      tags: [Auth]
      summary: Complete browser login
      responses:
        "302": { description: Redirect after login }
  /logout:
    get:
      operationId: logoutBrowserSession
      tags: [Auth]
      summary: End browser session
      parameters:
        - name: returnTo
          in: query
          schema: { type: string }
      responses:
        "302": { description: Redirect after logout }
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status: { type: string }
      required: [status]
    Complaint:
      type: object
      required: [id, complaintNumber, issueType, severity, confidence, description, latitude, longitude, address, imageUrl, status, createdAt, updatedAt, reporterName, priorityScore]
      properties:
        id: { type: integer }
        complaintNumber: { type: string }
        issueType: { type: string }
        severity: { type: string }
        confidence: { type: number }
        description: { type: string }
        latitude: { type: number }
        longitude: { type: number }
        address: { type: string }
        imageUrl: { type: ["string", "null"] }
        status: { type: string }
        authorityNotes: { type: ["string", "null"] }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        reporterName: { type: string }
        priorityScore: { type: integer }
    ComplaintInput:
      type: object
      required: [issueType, severity, confidence, description, latitude, longitude, address]
      properties:
        issueType: { type: string, minLength: 1, maxLength: 60 }
        severity: { type: string, enum: [low, medium, high, critical] }
        confidence: { type: number, minimum: 0, maximum: 1 }
        description: { type: string, minLength: 8, maxLength: 1200 }
        latitude: { type: number, minimum: -90, maximum: 90 }
        longitude: { type: number, minimum: -180, maximum: 180 }
        address: { type: string, minLength: 2, maxLength: 240 }
        imageUrl: { type: ["string", "null"] }
    ComplaintStatusUpdate:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [submitted, under_review, assigned, in_progress, resolved, rejected]
        note: { type: string, maxLength: 1200 }
    StatusHistory:
      type: object
      required: [id, complaintId, oldStatus, newStatus, changedBy, note, createdAt]
      properties:
        id: { type: integer }
        complaintId: { type: integer }
        oldStatus: { type: ["string", "null"] }
        newStatus: { type: string }
        changedBy: { type: string }
        note: { type: ["string", "null"] }
        createdAt: { type: string, format: date-time }
    DashboardSummary:
      type: object
      required: [issuesReported, issuesResolved, activeComplaints, highPriority]
      properties:
        issuesReported: { type: integer }
        issuesResolved: { type: integer }
        activeComplaints: { type: integer }
        highPriority: { type: integer }
    ImageAnalysisInput:
      type: object
      required: [imageData]
      properties:
        imageData: { type: string, minLength: 20, maxLength: 12000000 }
    ImageAnalysis:
      type: object
      required: [issueType, severity, confidence, description, demoMode]
      properties:
        issueType: { type: string }
        severity: { type: string, enum: [low, medium, high, critical] }
        confidence: { type: number, minimum: 0, maximum: 1 }
        description: { type: string }
        demoMode: { type: boolean }
    UploadUrlRequest:
      type: object
      required: [name, size, contentType]
      properties:
        name: { type: string, minLength: 1, maxLength: 255 }
        size: { type: integer, minimum: 1 }
        contentType: { type: string, minLength: 1 }
    UploadUrlResponse:
      type: object
      required: [uploadURL, objectPath, metadata]
      properties:
        uploadURL: { type: string, format: uri }
        objectPath: { type: string }
        metadata: { $ref: "#/components/schemas/UploadUrlRequest" }
    FinalizeObjectUploadInput:
      type: object
      required: [objectPath]
      properties:
        objectPath: { type: string, minLength: 1, maxLength: 500 }
    FinalizeObjectUploadResult:
      type: object
      required: [imageUrl]
      properties:
        imageUrl: { type: string }
    AuthUser:
      type: object
      required: [id, email, firstName, lastName, profileImageUrl, role]
      properties:
        id: { type: string }
        email: { type: ["string", "null"], format: email }
        firstName: { type: ["string", "null"] }
        lastName: { type: ["string", "null"] }
        profileImageUrl: { type: ["string", "null"] }
        role: { type: string, enum: [citizen, authority] }
    AuthUserEnvelope:
      type: object
      required: [user]
      properties:
        user:
          oneOf:
            - { $ref: "#/components/schemas/AuthUser" }
            - { type: "null" }
    ErrorEnvelope:
      type: object
      required: [error]
      properties:
        error: { type: string }
